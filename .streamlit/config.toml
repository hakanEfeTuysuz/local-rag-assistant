# Streamlit ayarları — `streamlit run app.py` proje klasöründen çalıştırıldığında otomatik okunur.

[server]
# Uygulama sadece bu bilgisayardan açılabilir; belgeleriniz aynı ağdaki
# (veya güvenlik duvarı yoksa internetteki) başkalarına açılmaz.
# Ağdaki başka bir cihazdan bilerek erişmek isterseniz:
#   streamlit run app.py --server.address 0.0.0.0
address = "localhost"

[browser]
# Streamlit'in kullanım istatistiklerini kendi sunucularına göndermesini kapatır.
gatherUsageStats = false

[client]
# Son kullanıcıya gerekmeyen geliştirici menülerini ("Deploy" vb.) gizler.
toolbarMode = "minimal"

# ---------------------------------------------------------------------------
# Tema: açık ve koyu mod için ayrı palet. Sistem temasına göre otomatik seçilir
# (sağ üstteki ⋮ > Settings menüsünden elle de değiştirilebilir).
# Yazı tipi Streamlit ile birlikte gelir; internetten font indirilmez.
# ---------------------------------------------------------------------------
[theme]
baseRadius = "0.75rem"
buttonRadius = "0.6rem"
headingFontWeights = [800, 700, 700, 600, 600, 600]
showSidebarBorder = true

[theme.light]
primaryColor = "#4F46E5"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F5F9"
textColor = "#0F172A"
borderColor = "#E2E8F0"
linkColor = "#4338CA"

[theme.light.sidebar]
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#EEF2F7"

[theme.dark]
primaryColor = "#818CF8"
backgroundColor = "#0B1120"
secondaryBackgroundColor = "#1A2333"
textColor = "#E2E8F0"
borderColor = "#2A3548"
linkColor = "#A5B4FC"

[theme.dark.sidebar]
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#1A2333"
