name: Testler

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu kopyala
        uses: actions/checkout@v4

      - name: Python 3.10 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Ruff ile kod kontrolü
        run: |
          pip install ruff
          ruff check .

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Depoyu kopyala
        uses: actions/checkout@v4

      - name: Python 3.10 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip                      # bağımlılıklar her seferinde baştan indirilmez
          cache-dependency-path: requirements.txt

      - name: Bağımlılıkları kur
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Testleri çalıştır
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          ANONYMIZED_TELEMETRY: "False"
        run: python testleri_calistir.py
